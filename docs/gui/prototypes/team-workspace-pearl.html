}

<div id="cothink-prototype" aria-label="CoThink 珍珠白液态玻璃交互原型">
  <div class="cp-shell">
    <div class="cp-atmosphere" aria-hidden="true"></div>
    <aside class="cp-rail" aria-label="项目团队">
      <div class="cp-brand"><strong>CoThink</strong><span class="cp-proto">原型</span></div>
      <div class="cp-railtools"><button class="cp-search-trigger" data-action="search"><i data-lucide="search" aria-hidden="true"></i>搜索<kbd>⌘ K</kbd></button><button class="cp-newteam" data-action="new-team" aria-label="新建 Team" data-tooltip="新建 Team"><i data-lucide="plus" aria-hidden="true"></i></button></div>
      <div class="cp-section-label">Teams</div>
      <div class="cp-teamlist"></div>
      <div class="cp-railbottom"><button data-action="general"><i data-lucide="message-circle" aria-hidden="true"></i>通用对话</button><button data-action="settings"><i data-lucide="settings-2" aria-hidden="true"></i>设置</button></div>
    </aside>
    <main class="cp-main">
      <header class="cp-header"><button class="cp-nav-toggle" data-action="nav-toggle" aria-label="切换侧栏"><i data-lucide="panel-left" aria-hidden="true"></i></button><button class="cp-title-button" data-action="team-menu"><span></span><i data-lucide="chevron-down" aria-hidden="true"></i></button><div class="cp-header-actions"><button data-action="history"><i data-lucide="messages-square" aria-hidden="true"></i>对话<i data-lucide="chevron-down" aria-hidden="true"></i></button><button data-action="roster"><span class="cp-small-avatar">A</span>阵容</button></div></header>
      <div class="cp-notice" hidden></div>
      <div class="cp-workspace">
        <section class="cp-conversation" aria-label="当前对话">
          <div class="cp-transcript"><div class="cp-messages"></div></div>
          <div class="cp-composer-area"><form class="cp-composer"><div class="cp-composer-tag" hidden></div><textarea aria-label="输入任务" placeholder="描述你想完成的事……" rows="2"></textarea><div class="cp-composer-controls"><button type="button" data-action="add-menu" aria-label="更多输入操作"><i data-lucide="plus" aria-hidden="true"></i></button><button type="button" data-action="mode-menu" class="cp-mode-button">多模型<i data-lucide="chevron-down" aria-hidden="true"></i></button><button type="button" data-action="send" class="cp-send" aria-label="发送任务" disabled><i data-lucide="arrow-up" aria-hidden="true"></i></button></div></form><p class="cp-composer-hint">交互原型 · 发送将演示工作流程，不调用模型</p></div>
        </section>
        <div class="cp-detail-dim" data-action="close-detail" hidden></div><aside class="cp-detail" hidden aria-label="阅读面板"></aside>
      </div>
    </main>

    <div class="cp-popover" hidden></div>
    <div class="cp-overlay" hidden><section class="cp-modal" role="dialog" aria-modal="true" aria-labelledby="cp-modal-title"></section></div>
    <div class="cp-toast" role="status" aria-live="polite" hidden></div>
  </div>
</div>
<script>
(()=>{
  const root=document.getElementById('cothink-prototype');
  const $=s=>root.querySelector(s), $$=s=>[...root.querySelectorAll(s)];
  const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const presets=[{id:'daily',name:'日常协作',main:'Astra',review:'DeepSeek'},{id:'writing',name:'写作搭档',main:'Kimi K3.1',review:'Opus 5.5'},{id:'light',name:'轻量组合',main:'DeepSeek',review:'Kimi K3.1'}];
  const tones=['','tone-lilac','tone-sand','tone-blue'];
  const seed=()=>({version:1,paletteVersion:'pearl-1',current:'ct',theme:'light',teams:[{id:'ct',name:'CoThink 开发',initial:'C',tone:'',path:'/projects/cothink',preset:'daily',selected:'nav',unread:true,unreadChat:'nav'},{id:'llm',name:'LLM 学习',initial:'学',tone:'tone-lilac',path:'',preset:'light',selected:'attention'},{id:'paper',name:'论文阅读',initial:'研',tone:'tone-sand',path:'',preset:'writing',selected:'reading',needs:true,attentionChat:'reading'},{id:'general',name:'通用对话',initial:'聊',tone:'tone-blue',path:'',preset:'daily',selected:'general-chat'}],chats:[{id:'nav',team:'ct',title:'项目导航重设计',mode:'cothink',preset:'daily',draft:'',scroll:0,messages:[{role:'user',text:'把新的项目导航整理成一个清晰的方案。希望尽量简洁，但历史和成果都能找回来。'},{role:'assistant',kind:'navigation',file:'项目导航方案.md',preset:'daily',mode:'cothink'}]},{id:'login',team:'ct',title:'登录流程检查',mode:'cothink',preset:'daily',draft:'',scroll:0,messages:[{role:'user',text:'检查登录流程，先分析问题，不要修改代码。'},{role:'assistant',kind:'login',file:'登录流程检查.md',preset:'daily',mode:'cothink'}]},{id:'attention',team:'llm',title:'理解多头注意力',mode:'cothink',preset:'light',draft:'',scroll:0,messages:[{role:'user',text:'为什么注意力需要多个头？一个头不能完成同样的事情吗？'},{role:'assistant',kind:'learning',preset:'light',mode:'cothink'}]},{id:'reading',team:'paper',title:'论文精读的重点',mode:'cothink',preset:'writing',draft:'',scroll:0,messages:[{role:'user',text:'我们来精读这篇论文。先帮我确定阅读重点。'},{role:'assistant',kind:'question',preset:'writing',mode:'cothink'}]},{id:'general-chat',team:'general',title:'新对话',mode:'cothink',preset:'daily',draft:'',scroll:0,messages:[]} ]});
  let state=seed(), active=null, detail=null, modalKind=null, menuKind=null, toastTimer=null, saveTimer=null, simulationTimer=null, navOpen=false, madeHtml=false, focusReturn=null,detailFocus=null;
  const saved=window.openai?.widgetState?.privateContent;
  if(saved?.version===1&&Array.isArray(saved.teams)&&Array.isArray(saved.chats))state=saved;
  function usePearlDefault(){if(state.paletteVersion!=='pearl-1'){state.theme='light';state.paletteVersion='pearl-1';}}
  usePearlDefault();
  const team=()=>state.teams.find(t=>t.id===state.current)||state.teams[0];
  const chat=()=>state.chats.find(c=>c.id===team().selected)||state.chats.find(c=>c.team===team().id);
  const preset=id=>presets.find(p=>p.id===id)||presets[0];
  const avatar=t=>`<span class="cp-avatar ${t.tone||''}">${esc(t.initial||t.name[0])}</span>`;
  const newId=p=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,5);
  function icons(){if(window.lucide)window.lucide.createIcons({attrs:{width:16,height:16}});}
  function save(action='浏览原型'){
    const snapshot={modelContent:{project:team().name,conversation:chat()?.title,mode:chat()?.mode,action},privateContent:state};
    if(JSON.stringify(snapshot).length<15000&&window.openai?.setWidgetState)window.openai.setWidgetState(snapshot).catch(()=>{});
  }
  function toast(text){clearTimeout(toastTimer);$('.cp-toast').textContent=text;$('.cp-toast').hidden=false;toastTimer=setTimeout(()=>$('.cp-toast').hidden=true,2600);}
  function applyTheme(){root.style.colorScheme=state.theme==='auto'?'light dark':state.theme;}
  function closeMenu(){menuKind=null;$('.cp-popover').hidden=true;}
  function closeModal(){modalKind=null;$('.cp-overlay').hidden=true;$('.cp-rail').inert=false;$('.cp-main').inert=false;focusReturn?.focus?.();}
  function closeDetail(){detail=null;$('.cp-detail').hidden=true;$('.cp-detail-dim').hidden=true;if(detailFocus?.isConnected)detailFocus.focus();}
  function capture(){if(chat())chat().scroll=$('.cp-transcript').scrollTop;}
  function selectTeam(id){capture();state.current=id;if(team().unreadChat===chat()?.id)team().unread=false;navOpen=false;closeMenu();closeDetail();render();save('切换 Team');}
  function selectChat(id){const c=state.chats.find(x=>x.id===id);if(!c)return;capture();state.current=c.team;team().selected=id;if(!team().unreadChat||team().unreadChat===id)team().unread=false;closeMenu();closeModal();closeDetail();render();save('打开对话');}
  function createChat(){capture();const t=team(), c={id:newId('chat'),team:t.id,title:'新对话',mode:'cothink',preset:t.preset,draft:'',scroll:0,messages:[]};state.chats.push(c);t.selected=c.id;closeMenu();closeDetail();render();$('.cp-composer textarea').focus();save('新建对话');}
  function renderSidebar(){
    $('.cp-teamlist').innerHTML=state.teams.filter(t=>t.id!=='general'&&!t.archived).map(t=>{const c=state.chats.find(c=>c.id===(t.unread&&t.unreadChat?t.unreadChat:t.selected)),run=active?.team===t.id;return `<button class="cp-teamrow ${state.current===t.id?'is-current':''}" data-action="select-team" data-id="${t.id}" aria-label="打开 ${esc(t.name)}" ${state.current===t.id?'aria-current="page"':''}>${avatar(t)}<span class="cp-teaminfo"><span class="cp-teamname">${esc(t.name)}${t.needs?'<span class="cp-dot amber" aria-label="需要处理"></span>':t.unread?'<span class="cp-dot" aria-label="有新结果"></span>':run?'<span class="cp-dot running" aria-label="运行中"></span>':''}</span><span class="cp-teamsub">${t.needs?'有一个问题需要你确认':run?'正在处理 · '+esc(active.phase):t.unread?'有新结果 · '+esc(c?.title||''):esc(c?.title||'从第一件事开始')}</span></span></button>`}).join('');
    $('[data-action="general"]').classList.toggle('is-current',state.current==='general');$('.cp-shell').classList.toggle('nav-open',navOpen);$('.cp-mobile-scrim').hidden=!navOpen;
  }
  function body(m){
    if(m.kind==='navigation')return `<p>可以把入口收敛到<strong>项目、对话和成果</strong>。你回来时，先找到正在做的事。</p><ul><li><strong>左边只放项目团队。</strong> 每个 Team 保留最近进展，不展开所有历史。</li><li><strong>主区直接继续对话。</strong> 换一个话题时，在 Team 内新开一条。</li><li><strong>需要时再看过程。</strong> 成果就近打开，模型讨论收在同一轮记录里。</li></ul><p>换模型只调整阵容。项目、旧对话和成果都留在原处。</p>`;
    if(m.kind==='login')return `<p>有两处值得先处理：</p><ul><li><strong>登录过期后，返回位置丢失。</strong> 可以保存进入登录页之前的路径。</li><li><strong>错误提示太笼统。</strong> 凭据错误与连接失败应该分别说明。</li></ul><p>先修复第一项即可验证完整流程。第二项可以单独开一条对话继续。</p>`;
    if(m.kind==='learning')return `<p>一个头会为当前位置算出<strong>一组“该关注谁”的权重</strong>。多个头，则可以同时得到几组不同的权重。</p><p>例如读“这只猫很困，因为它昨晚没睡好”：一个头可能关注“它”对应谁，另一个头关注“困”的原因。它们各自在自己的表示空间里取信息，最后合到一起。</p><p>不过，“某个头专门负责语法”只是帮助理解的例子，实际分工是训练学出来的，并没有提前规定。</p>`;
    if(m.kind==='question')return `<p>这次精读，你更想先解决哪件事？</p><div class="cp-question-actions"><button data-action="answer-question" data-value="先看方法与假设">方法与假设</button><button data-action="answer-question" data-value="先看实验与结论">实验与结论</button></div>`;
    if(m.kind==='cancelled')return `<p>本轮已停止。已提交的任务和当前草稿都保留，可以继续说明下一步。</p><p class="cp-secondary-text">原型没有执行文件修改。</p>`;
    if(m.kind==='work')return `<p>已整理好这次修改的交付示例。你可以先看文件，再查看差异和检查记录。</p><ul><li>保留已有对话与项目归属。</li><li>将次要操作收进对应入口。</li><li>下一步可以围绕具体文件继续反馈。</li></ul><p class="cp-secondary-text">这是模拟结果，尚未修改任何项目文件。</p>`;
    if(m.kind==='paper')return `<p>我们先从<strong>${esc(m.topic||'方法与假设')}</strong>开始。</p><p>阅读时先明确作者要解决的问题，再检查方法成立的条件，最后找出能支持结论的证据。遇到公式时，先说明输入、输出和每个符号的作用。</p><p>正式使用时，这里会根据你提供的论文展开；当前仅演示对话继续后的布局。</p>`;
    return `<p>这轮围绕<strong>“${esc((m.topic||'你的任务').slice(0,65))}”</strong>继续。</p><p>完整答复会出现在这里；相关文件放在答复下方，评审和处理说明可以按需打开。你可以直接提出修改，也可以换一个话题新建对话。</p><p class="cp-secondary-text">示例回复 · 未调用模型</p>`;
  }
  function messageHtml(m,i){
    if(m.role==='user')return `<div class="cp-user">${esc(m.text)}</div>`;
    const c=chat();return `<article class="cp-answer"><div class="cp-author"><span class="cp-author-mark">c</span><span>CoThink</span><time>${i<2?'10:42':'刚刚'}</time></div><div class="cp-answer-body">${body(m)}</div>${m.file?`<button class="cp-filechip" data-action="file" data-index="${i}"><span class="cp-file-icon">${icon('file-text')}</span><span><span class="cp-filename">${esc(m.file)}</span><small>Markdown · 示例成果</small></span>${icon('arrow-up-right')}</button>`:''}<div class="cp-answer-actions"><button data-action="process" data-index="${i}">${icon('git-branch')}查看过程</button><button class="cp-subaction" data-action="copy" data-index="${i}" aria-label="复制这条回复">${icon('copy')}</button><button class="cp-subaction" data-action="branch" data-index="${i}" aria-label="从这条回复分支">${icon('split')}</button></div></article>`;
  }
  function renderMessages(){
    const c=chat(),t=team();
    $('.cp-messages').innerHTML=c.messages.length?`<div class="cp-day">${esc(c.title)} · 今天</div>${c.messages.map(messageHtml).join('')}`:`<div class="cp-empty">${avatar(t)}<h2>${t.id==='general'?'有什么想聊的？':'从第一件事开始'}</h2><p>${t.id==='general'?'不关联项目，对话仍会保留。':esc(t.name)+' · 描述你想完成的事'}</p></div>`;
    if(active?.chat===c.id)$('.cp-messages').insertAdjacentHTML('beforeend',`<div class="cp-running" role="status" aria-live="polite"><span class="cp-pulse"></span><span>${esc(active.phase)}</span><button data-action="stop">${icon('square')}停止</button></div>`);
  }
  function renderNotice(){
    const n=$('.cp-notice');n.hidden=true;
    if(active&&active.chat!==chat().id){n.innerHTML=`${icon('loader-circle')}<span>${esc(state.teams.find(t=>t.id===active.team)?.name)} · ${esc(active.phase)}</span><button data-action="return-active">返回任务</button><button data-action="stop">停止</button>`;n.hidden=false;}
    else if(team().archived){n.innerHTML=icon('archive')+'<span>此 Team 已归档，历史和成果仍可阅读。</span><button data-action="restore-current">恢复 Team</button>';n.hidden=false;}else if(team().unread&&team().unreadChat&&team().unreadChat!==chat().id){n.innerHTML=icon('message-square')+'<span>另一条对话有新结果</span><button data-action="open-unread">查看新结果</button>';n.hidden=false;}else if(team().needs&&chat().id!==team().attentionChat&&team().attentionChat){n.innerHTML=`${icon('circle-help')}<span>另一条对话需要你处理</span><button data-action="open-attention">查看待处理</button>`;n.hidden=false;}
  }
  function renderComposer(){const c=chat();$('.cp-composer textarea').value=c.draft||'';$('.cp-composer textarea').placeholder=active?'任务进行中，可以先写草稿……':'描述你想完成的事……';$('.cp-mode-button').innerHTML=(c.mode==='one'?'单模型':'多模型')+icon('chevron-down');$('.cp-composer textarea').disabled=!!team().archived;$('.cp-send').disabled=!c.draft?.trim()||!!active||!!team().archived;$('.cp-composer-tag').hidden=!madeHtml;if(madeHtml)$('.cp-composer-tag').innerHTML=`${icon('code-2')}制作 HTML/SVG · 仅本次<button type="button" data-action="clear-tag" aria-label="移除制作标记">×</button>`;}
  function render(){applyTheme();renderSidebar();$('.cp-title-button span').textContent=team().name;$('.cp-small-avatar').textContent=preset(chat().preset).main[0];renderNotice();renderMessages();renderComposer();icons();requestAnimationFrame(()=>$('.cp-transcript').scrollTop=chat()?.scroll||0);}
  function scrollBottom(){requestAnimationFrame(()=>{const t=$('.cp-transcript');t.scrollTop=t.scrollHeight;if(chat())chat().scroll=t.scrollTop;});}
  function openModal(kind,html,wide=false){closeMenu();focusReturn=document.activeElement;modalKind=kind;$('.cp-modal').className='cp-modal'+(wide?' wide':'');$('.cp-modal').innerHTML=`<button class="cp-close" data-action="close-modal" aria-label="关闭">${icon('x')}</button>`+html;$('.cp-overlay').hidden=false;$('.cp-rail').inert=true;$('.cp-main').inert=true;icons();requestAnimationFrame(()=>($('.cp-modal input:not([type=radio]):not([type=checkbox])')||$('.cp-modal button:not(.cp-close)')||$('.cp-close')).focus());}
  function openPopover(kind,trigger,html){if(menuKind===kind){closeMenu();return;}menuKind=kind;const pop=$('.cp-popover');pop.innerHTML=html;pop.hidden=false;const shell=$('.cp-shell').getBoundingClientRect(),r=trigger.getBoundingClientRect();let x=r.left-shell.left,y=r.bottom-shell.top+6;pop.style.left=Math.min(Math.max(8,x),shell.width-240)+'px';pop.style.top='0px';pop.style.width=kind==='history'?'285px':'220px';if(kind==='add'||kind==='mode')y=r.top-shell.top-pop.offsetHeight-8;pop.style.top=Math.max(8,Math.min(y,shell.height-pop.offsetHeight-8))+'px';icons();}
  function newTeamDialog(){openModal('new-team',`<h2 id="cp-modal-title">新建 Team</h2><p class="cp-modal-desc">为一件持续的工作留一个位置。</p><form id="cp-team-form"><label class="cp-field">团队名称<input name="name" placeholder="例如：个人网站" maxlength="28" required autocomplete="off"></label><details><summary>关联项目目录（可选）</summary><label class="cp-field"><input name="path" placeholder="/projects/my-project" autocomplete="off"></label><small>原型仅模拟关联，不会访问或创建目录。</small></details><p class="cp-secondary-text" style="font-size:11px">默认阵容：${esc(preset(team().preset).name)} · 随时可以调整</p><div class="cp-form-error" role="alert"></div><div class="cp-modal-footer"><button type="button" data-action="close-modal">取消</button><button class="cp-primary" type="button" data-action="submit-form">创建 Team</button></div></form>`);}
  function rosterDialog(){const c=chat(),t=team();openModal('roster',`<h2 id="cp-modal-title">模型阵容</h2><p class="cp-modal-desc">用于本对话接下来的任务，历史保持原样。</p><form id="cp-roster-form">${presets.map(p=>`<label class="cp-preset"><input type="radio" name="preset" value="${p.id}" ${c.preset===p.id?'checked':''} ${active?'disabled':''}><span>${p.name}<small>${p.main} · 主答　／　${p.review} · 评审</small></span></label>`).join('')}<label class="cp-checkbox"><input type="checkbox" name="useDefault" ${active?'disabled':''}>也用于这个 Team 的新对话</label><div class="cp-modal-note">${active?'有任务正在运行，结束后才能更换阵容。':'Team 默认：'+esc(preset(t.preset).name)+'。其他已有对话继续使用各自的阵容。'}<br>以上为演示组合，不代表你的实际模型配置。</div><div class="cp-modal-footer"><button type="button" data-action="close-modal">取消</button><button class="cp-primary" type="button" data-action="submit-form" ${active?'disabled':''}>使用此阵容</button></div></form>`);}
  function openSearch(){openModal('search',`<h2 id="cp-modal-title">找回一件事</h2><input class="cp-search-input" aria-label="搜索 Team 和对话" placeholder="搜索 Team、对话或文件……" autocomplete="off"><label class="cp-checkbox"><input type="checkbox" id="cp-search-archived">包含归档</label><div class="cp-resultlist"></div>`,true);renderSearch('');}
